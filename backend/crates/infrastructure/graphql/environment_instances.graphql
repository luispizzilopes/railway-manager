query EnvironmentInstances($id: String!, $first: Int!, $after: String) {
  environment(id: $id) {
    id
    deletedAt
    serviceInstances(first: $first, after: $after) {
      edges {
        node {
          ...InstanceFields
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

fragment InstanceFields on ServiceInstance {
  serviceId
  serviceName
  environmentId
  deletedAt
  latestDeployment {
    ...DeploymentFields
  }
  activeDeployments {
    ...DeploymentFields
  }
}

fragment DeploymentFields on Deployment {
  id
  status
  canRedeploy
  deploymentStopped
}
