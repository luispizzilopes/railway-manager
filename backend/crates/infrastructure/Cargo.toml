[package]
name = "infrastructure"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
application = { version = "0.1.0", path = "../application" }
async-trait = "0.1.92"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
domain = { version = "0.1.0", path = "../domain" }
graphql_client = "0.16.0"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1.44"
uuid = "1.29.2"
zeroize = "1.9.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
wiremock = "0.6.5"
