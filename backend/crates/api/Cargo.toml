[package]
name = "api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
application = { version = "0.1.0", path = "../application" }
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10.4"
domain = { version = "0.1.0", path = "../domain" }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
uuid = "1.29.2"

[lints]
workspace = true

[dev-dependencies]
application = { path = "../application", features = ["testkit"] }
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
