<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <style>
      /* Ordem das camadas fixada antes de qualquer CSS: o CSS dos componentes pode chegar ao bundle antes de styles/index.css. */
      @layer reset, tokens, base, components, pages, utilities;
    </style>
    <script>
      // Aplica o tema antes da primeira pintura (mesma regra de src/theme.ts).
      try {
        var t = localStorage.getItem('rm:theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>Railway Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
